# ==============================================================================
# UNIFIED PRODUCTION DOCKER COMPOSE — DEALERSHIP MANAGEMENT SYSTEM
# Orchestrates MySQL 8 Database, Spring Boot Backend API, and Nginx/React Frontend
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE SERVICE (MySQL 8)
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0.36
    container_name: dealership-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_prod_secure}
      MYSQL_DATABASE: ${DB_NAME:-dealership_db}
      MYSQL_USER: ${DB_USERNAME:-dealership_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dealership_pass_secure}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dealership-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME:-dealership_user}", "-p${DB_PASSWORD:-dealership_pass_secure}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 2. BACKEND API SERVICE (Spring Boot 3.4.2 / Java 21)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dealership-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-dealership_db}
      DB_USERNAME: ${DB_USERNAME:-dealership_user}
      DB_PASSWORD: ${DB_PASSWORD:-dealership_pass_secure}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
      STORAGE_UPLOAD_DIR: /app/uploads
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - dealership-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/api/v1.0/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ----------------------------------------------------------------------------
  # 3. FRONTEND UI SERVICE (React 18 + Vite 5 served via Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1.0}
    container_name: dealership-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - dealership-network

# ------------------------------------------------------------------------------
# VOLUMES & NETWORKS
# ------------------------------------------------------------------------------
volumes:
  mysql_data:
    name: dealership_mysql_data
  backend_uploads:
    name: dealership_backend_uploads

networks:
  dealership-network:
    name: dealership-network
    driver: bridge
